apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sapienfrom2000s/proxmox-local.git
    path: code/k8s/gateway
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
