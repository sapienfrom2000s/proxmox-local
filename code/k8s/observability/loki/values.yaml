gateway:
  metrics:
    enabled: false
chunksCache:
  enabled: false
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  useTestSchema: true
singleBinary:
  replicas: 1
  persistence:
    enabled: false
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
