apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      values: |
        grafana:
          adminPassword: admin
          ingress:
            enabled: false
          service:
            type: ClusterIP
        prometheus:
          service:
            type: ClusterIP
          prometheusSpec:
            storageSpec:
              emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
