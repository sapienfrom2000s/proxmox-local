grafana:
  adminPassword: admin
  ingress:
    enabled: false
  service:
    type: ClusterIP
  sidecar:
    datasources:
      enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-stack:3100
      access: proxy
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    storageSpec:
      emptyDir: {}
